[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_offset = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  hostname = "sigmaserver"

# --- ENTRADA: Suscripción a Tópicos MQTT de los Nodos Sensores SIGMA ---
[[inputs.mqtt_consumer]]
  servers = ["tcp://sigma_broker:1883"]
  topics = [
    "sigma/nodos/+/telemetria"
  ]
  data_format = "json"
  topic_tag = "topic"

# --- SALIDA: Inserción en la Base de Datos InfluxDB 2.7 ---
[[outputs.influxdb_v2]]
  urls = ["http://sigma_influxdb:8086"]
  token = "$INFLUX_TOKEN"
  organization = "sigma_org"
  bucket = "sigma_bucket"
