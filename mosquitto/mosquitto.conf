# Puerto de escucha estándar MQTT
listener 1883 0.0.0.0

# Permitir conexiones anónimas en red local de pruebas (se recomienda autenticación por usuario/clave en producción)
allow_anonymous true

# Persistencia de mensajes en disco
persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
